[versions]
agp = "8.9.2"
fragmentKtx = "1.8.6"
generativeai = "0.9.0"
junitJupiter = "5.10.0"
junitJupiterEngine = "5.10.0"
junitVintageEngine = "5.10.0"
kotlin = "2.0.0"
coreKtx = "1.15.0"
junit = "4.13.2"
